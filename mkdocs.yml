site_name: Diário da Jornada de Dados
site_description: Aprendizados, anotações e projetos enquanto construo minha carreira em dados
site_author: Erica Nicollas
copyright: "© 2026 Diário da Jornada de Dados. Todos os direitos reservados."

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font: false
  icon:
    logo: material/notebook-outline
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/erica-luuz
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/erica-luz-032305177
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:erica.nicollas_hbn@yahoo.com
      name: E-mail

plugins:
  - search:
      lang:
        - pt
  - blog:
      blog_dir: blog
      post_date_format: long
      archive: true
      categories: true
  - tags

nav:
  - Início: index.md
  - Blog: blog/index.md
  - Tópicos: topicos.md
  - Sobre: sobre.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
